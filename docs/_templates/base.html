{% extends "!base.html" %}

{%- block scripts %}
  {{ super() }}

  <!-- OSA Chat Widget (HED Assistant)
       Privacy Note: nothing is sent until the visitor submits a question. Each question
       goes to the OSA service with the widgetInstructions below and, while the "Share
       page URL to help answer questions" checkbox in the widget footer is ticked, the
       current page's URL and title. Page text is not sent. The checkbox is shown whenever
       allowPageContext is true, starts in the pageContextDefaultEnabled state, and the
       visitor's choice is kept in localStorage.
       Service: OSA Chat Widget (demo.osc.earth)
  -->
  <script>
    // Define config before the widget script loads
    window.osaChatConfig = {
      communityId: 'hed',
      title: 'HED Tools Assistant',
      initialMessage: 'Questions about HED or Python HEDTools? Ask me!',
      placeholder: 'Questions about Python HEDTools?',
      suggestedQuestions: [
        'How do I install the Python HEDTools?',
        'How do I validate a HED string using the Python HEDTools?',
        'How do I run the HEDTools hedpy command line tool?',
        'What tools are available?'
      ],
      widgetInstructions: 'User is on the Python HEDTools documentation most likely looking for how to use these tools. Load documents that have hed-python in their URLs immediately.',
      showExperimentalBadge: true,
      allowPageContext: true,
      pageContextDefaultEnabled: true
    };
  </script>
  <script src="https://demo.osc.earth/osa-chat-widget.js"
    crossorigin="anonymous"
    defer
    onload="window.OSAChatWidget && window.OSAChatWidget.setConfig(window.osaChatConfig)">
  </script>
{%- endblock scripts %}
