name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read
  id-token: write

jobs:
  determine_version:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == 'push' && "${{ github.ref }}" == 'refs/heads/main' ]]; then
            # Push to main branch
            echo 'matrix=["3.10", "3.11", "3.12", "3.13", "3.14"]' >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.base.ref }}" == 'main' ]]; then
            # PR to main branch
            echo 'matrix=[ "3.10", "3.11", "3.12", "3.13", "3.14"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["3.10", "3.13"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: determine_version
    # Keeps the check names "build (<platform>, <python>)"; only the minimum-pandas job adds a suffix.
    name: build (${{ matrix.platform }}, ${{ matrix.python-version }}${{ matrix.pandas != 'latest' && format(', pandas {0}', matrix.pandas) || '' }})
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ${{fromJson(needs.determine_version.outputs.matrix)}}
        # "latest": the newest pandas the Python version allows. The extra job tests the floor in pyproject.toml.
        pandas: [latest]
        include:
          - platform: ubuntu-latest
            python-version: "3.10"
            pandas: "2.2.3"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      # Install dependencies
      - name: Install dependencies
        run: uv pip install -e ".[docs,test]"

      - name: Install the minimum supported pandas
        if: matrix.pandas != 'latest'
        run: uv pip install "pandas==${{ matrix.pandas }}"

      # Run spec tests without coverage for non Python 3.10
      - name: Run spec_test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |  
           python -m unittest discover spec_tests

      # Run unittest without coverage
      - name: Test with unittest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover tests
