name: Spec_tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.10"]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout hed-python
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Create virtual environment
        run: |
          uv venv --clear .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install -e ".[test]"

      - name: Character sets file matches hed-specification
        # hed/validator/data/character_sets.json is a verbatim copy of the file hed-specification
        # publishes (its docs/source/_static/character_sets.json, served at
        # https://www.hedtags.org/hed-specification/_static/character_sets.json). The file has one
        # home; this step fails when the copy drifts from hed-specification main.
        run: |
          curl -fsSL -o /tmp/character_sets.json \
            https://raw.githubusercontent.com/hed-standard/hed-specification/main/docs/source/_static/character_sets.json
          cmp /tmp/character_sets.json hed/validator/data/character_sets.json

      - name: Spec Error Tests
        id: spec_error_tests
        continue-on-error: true
        run: |
           echo "::group::Spec Test Results"
           python -m unittest spec_tests/test_errors.py
           echo "::endgroup::"

      - name: Bids Validation Test
        id: bids_validation_test
        continue-on-error: true
        run: |
           echo "::group::Bids Results"
           python -m unittest spec_tests/test_bids_datasets.py
           echo "::endgroup::"

      - name: Hed Cache Test
        env:
          HED_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: hed_cache_test
        continue-on-error: true
        run: |
           python -m unittest spec_tests/test_hed_cache.py

      - name: Fail if Tests Failed
        if: steps.spec_error_tests.outcome == 'failure' || steps.bids_validation_test.outcome == 'failure' || steps.hed_cache_test.outcome == 'failure'
        run: exit 1
